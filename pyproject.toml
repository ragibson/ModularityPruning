[build-system]
requires = ["setuptools >= 75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "modularitypruning"
version = "1.5.1"
description = "Pruning tool to identify small subsets of network partitions that are significant from the perspective of stochastic block model inference."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ryan Gibson", email = "ryan.alex.gibson@gmail.com" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed"
]
dependencies = [
    "leidenalg",
    "matplotlib",
    "numpy",
    "psutil",
    "igraph",
    "scikit-learn",
    "scipy>=1.7",
    "seaborn",
    "tqdm"
]

[tool.setuptools]
packages = ["modularitypruning"]

[tool.setuptools.package-dir]
modularitypruning = "utilities"

[tool.setuptools.package-data]
modularitypruning = ["py.typed"]

[tool.autopep8]
max_line_length = 120